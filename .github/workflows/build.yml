name: Builder tests
# Started by hand only in this repository (Actions tab > Run workflow): releases here are
# published by hand with MM3-Setup.exe, and pushes should not start jobs.
on: [workflow_dispatch]
jobs:
  builder:
    name: Builder tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test builder
        run: python -m unittest discover -s tests -p test_build_gui.py -v
